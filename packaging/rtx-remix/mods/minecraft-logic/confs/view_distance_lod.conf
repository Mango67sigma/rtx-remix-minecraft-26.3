# Follows view_distance_lod.conf in kazumasa200/rtx-remix-minecraft-26-3 (Apache-2.0).
#
# Far view-distance endpoint for LOD terrain, such as Distant Horizons'.
# confs/view_distance.conf and rtx.conf set the band for Minecraft's own render
# distance; this layer sits just above them, and the mod blends it from strength
# 0 at that band toward 1 at the farthest LOD radius Distant Horizons offers
# (4096 chunks), keeping the 70%..80% fade band at the radius of the LOD terrain
# drawn. Without LOD terrain its strength stays 0.
#
# Like view_distance.conf, this integration-owned profile is not an art profile.
# Keep it sparse so every higher-priority situational profile can override these
# keys.
rtx.viewDistance.distanceFadeMin = 45875.2
rtx.viewDistance.distanceFadeMax = 52428.8
